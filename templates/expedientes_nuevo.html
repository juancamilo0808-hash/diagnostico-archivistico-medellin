{% extends "base.html" %}
{% block title %}Nuevo expediente | Consejo Distrital de Archivos{% endblock %}
{% block content %}
<div class="mb-4"><a href="{{ url_for('expedientes_listar') }}" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Volver a expedientes</a><h2 class="mt-3 mb-1">Registrar expediente</h2><p class="text-secondary">Los campos marcados con * son obligatorios.</p></div>
<form method="post" class="row g-3">
  <div class="col-md-4"><label for="codigo" class="form-label">Código del expediente *</label><input id="codigo" name="codigo" class="form-control" maxlength="80" required value="{{ datos.get('codigo','') }}" placeholder="Ej. CDA-2026-0001"></div>
  <div class="col-md-8"><label for="titulo" class="form-label">Título del expediente *</label><input id="titulo" name="titulo" class="form-control" maxlength="250" required value="{{ datos.get('titulo','') }}"></div>
  <div class="col-md-6"><label for="entidad" class="form-label">Entidad productora *</label><input id="entidad" name="entidad" class="form-control" maxlength="250" required value="{{ datos.get('entidad','') }}"></div>
  <div class="col-md-6"><label for="serie_documental" class="form-label">Serie o subserie documental</label><input id="serie_documental" name="serie_documental" class="form-control" maxlength="250" value="{{ datos.get('serie_documental','') }}"></div>
  <div class="col-md-6"><label for="responsable" class="form-label">Responsable</label><input id="responsable" name="responsable" class="form-control" maxlength="250" value="{{ datos.get('responsable','') }}"></div>
  <div class="col-md-3"><label for="fecha_apertura" class="form-label">Fecha de apertura</label><input type="date" id="fecha_apertura" name="fecha_apertura" class="form-control" value="{{ datos.get('fecha_apertura','') }}"></div>
  <div class="col-md-3"><label for="estado" class="form-label">Estado</label><select id="estado" name="estado" class="form-select">{% for estado in ['Abierto','En trámite','Cerrado'] %}<option value="{{ estado }}" {% if datos.get('estado','Abierto') == estado %}selected{% endif %}>{{ estado }}</option>{% endfor %}</select></div>
  <div class="col-12"><label for="ubicacion" class="form-label">Ubicación o referencia de almacenamiento</label><input id="ubicacion" name="ubicacion" class="form-control" maxlength="500" value="{{ datos.get('ubicacion','') }}" placeholder="Repositorio, carpeta o referencia institucional"></div>
  <div class="col-12"><label for="descripcion" class="form-label">Descripción</label><textarea id="descripcion" name="descripcion" class="form-control" rows="4">{{ datos.get('descripcion','') }}</textarea></div>
  <div class="col-12 d-flex gap-2 mt-4"><button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Guardar expediente</button><a href="{{ url_for('expedientes_listar') }}" class="btn btn-outline-secondary">Cancelar</a></div>
</form>
{% endblock %}
